services:
  postgres:
    image: postgres:17-alpine
    container_name: mora-soccer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mora
      POSTGRES_PASSWORD: mora
      POSTGRES_DB: mora_soccer
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mora -d mora_soccer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
